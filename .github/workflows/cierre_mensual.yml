name: 🔒 Cierre Mensual Paranoico (Hot/Cold Storage)

on:
  schedule:
    # Ejecuta a las 3:00 AM (UTC) el día 1 de cada mes
    - cron: '0 3 1 * *'
  workflow_dispatch: # Este botón te permite correrlo manualmente desde GitHub por si alguna vez lo necesitas

jobs:
  cierre-mensual:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Descargar código del repositorio
      uses: actions/checkout@v3

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install gspread pandas google-auth python-dateutil

    - name: 🔐 Generar credenciales de Google
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_CREDENTIALS" > credenciales.json

    - name: 🚀 Ejecutar Script de Cierre Mensual
      run: python cierre_mensual.py